services:
  # Backend API Server
  - type: web
    name: interview-prep-ai-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    
  # Frontend Static Site
  - type: web
    name: interview-prep-ai-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: cd frontend/interview-prep-ai && npm install && npx vite build
    staticPublishPath: ./frontend/interview-prep-ai/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
